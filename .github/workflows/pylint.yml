name: Pylint

on: [pull_request]

jobs:
  # Add labels based on branch name
  add-labels:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      issues: write
    if: github.event.pull_request.head.ref != ''
    steps:
      - name: Add PR type labels
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const branchName = context.payload.pull_request.head.ref;
            let labelToAdd = '';

            if (branchName.startsWith('enh_')) {
              labelToAdd = 'enhancement';
            } else if (branchName.startsWith('day')) {
              labelToAdd = 'exercises';
            }

            if (labelToAdd) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                labels: [labelToAdd]
              });
            }

  # Update description
  update-desc:
    runs-on: ubuntu-latest
    needs: add-labels
    permissions:
      pull-requests: write
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Update PR description with commit list
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const pr = context.payload.pull_request;
            if (!pr) {
              core.info('No pull request in context, skipping.');
              return;
            }

            // Obtener commits del PR usando la REST API
            const commitsResp = await github.rest.pulls.listCommits({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
            });

            const messages = commitsResp.data
              .map(c => `- 📝 ${c.sha.slice(0,7)} ${c.commit.message.split('\n')[0]}`)
              .join('\n');

            const newSection = `### Commits\n${messages}\n`;
            const body = pr.body || '';

            // Reemplazar sección existente de commits si ya existe, si no añadirla arriba
            const updatedBody = body.includes('### Commits')
              ? body.replace(/### Commits[\s\S]*?(?:\n---\n|$)/, `${newSection}\n---\n`)
              : `${newSection}\n---\n${body}`;

            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
              body: updatedBody,
            });

  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v3
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pylint requests beautifulsoup4
      - name: Analysing the code with pylint
        run: |
          pylint $(git ls-files '*.py')
